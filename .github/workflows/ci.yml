name: CI
on:
  push:
    branches:
      - '**'

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build binary
        run: CGO_ENABLED=0 go build -tags=functional -o envoy-proxy-bouncer .

      - name: Run unit tests
        run: go test -v -coverprofile=coverage.txt ./...